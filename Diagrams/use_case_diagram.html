    <script>
        function downloadPNG() {
            const svg = document.querySelector('svg');
            
            // Clone the SVG to avoid modifying the original
            const svgClone = svg.cloneNode(true);
            
            // Set explicit dimensions
            svgClone.setAttribute('width', '3500');
            svgClone.setAttribute('height', '2200');
            svgClone.setAttribute('style', 'background-color: white;');
            
            // Create SVG data with proper namespace
            let svgData = new XMLSerializer().serializeToString(svgClone);
            
            // Fix namespace if needed
            if (!svgData.includes('xmlns')) {
                svgData = svgData.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            
            // Create data URL with charset
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            // Set high resolution for better quality
            const scale = 2;
            canvas.width = 3500 * scale;
            canvas.height = 2200 * scale;
            
            // Fill white background first
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            img.onload = function() {
                try {
                    // Draw the image on canvas
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Convert to blob with high quality
                    canvas.toBlob(function(blob) {
                        if (blob) {
                            const downloadUrl = URL.createObjectURL(blob);
                            const downloadLink = document.createElement('a');
                            downloadLink.download = 'ChildSecurity_UseCase_Diagram.png';
                            downloadLink.href = downloadUrl;
                            document.body.appendChild(downloadLink);
                            downloadLink.click();
                            document.body.removeChild(downloadLink);
                            
                            // Clean up
                            setTimeout(() => {
                                URL.revokeObjectURL(downloadUrl);
                                URL.revokeObjectURL(url);
                            }, 100);
                            
                            // Show success message
                            const btn = document.querySelector('.download-btn');
                            const originalText = btn.textContent;
                            btn.textContent = '✓ Downloaded!';
                            btn.style.background = '#28a745';
                            setTimeout(() => {
                                btn.textContent = originalText;
                                btn.style.background = '#4CAF50';
                            }, 2000);
                        } else {
                            alert('Error: Could not generate PNG. Please try again.');
                        }
                    }, 'image/png', 1.0); // Maximum quality
                } catch (e) {
                    console.error('Error rendering:', e);
                    alert('Error rendering image. Please try using browser screenshot instead.');
                }
            };
            
            img.onerror = function(e) {
                console.error('Image load error:', e);
                alert('Error loading SVG. Please try:\n1. Right-click on diagram → Save Image As\n2. Or use browser screenshot tools');
                URL.revokeObjectURL(url);
            };
            
            // Set crossOrigin to avoid CORS issues
            img.crossOrigin = 'anonymous';
            img.src = url;
        }
        
        // Alternative method using base64 data URL (often more reliable)
        function downloadPNGAlternative() {
            const svg = document.querySelector('svg');
            const svgRect = svg.getBoundingClientRect();
            
            // Create a copy of SVG with proper attributes
            const svgClone = svg.cloneNode(true);
            svgClone.setAttribute('version', '1.1');
            svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svgClone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
            svgClone.setAttribute('width', '3500');
            svgClone.setAttribute('height', '2200');
            
            // Serialize to string
            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(svgClone);
            
            // Fix any potential issues with fill colors
            svgString = svgString.replace(/fill="currentColor"/g, 'fill="#000"');
            
            // Create base64 data URL
            const base64 = btoa(unescape(encodeURIComponent(svgString)));
            const svgDataUrl = 'data:image/svg+xml;base64,' + base64;
            
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const scale = 2; // 2x for high DPI
                canvas.width = 3500 * scale;
                canvas.height = 2200 * scale;
                
                const ctx = canvas.getContext('2d');
                
                // Set white background
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Wait a bit for image to fully load
                setTimeout(() => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(function(blob) {
                        if (blob) {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'ChildSecurity_UseCase_Diagram.png';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            
                            // Show success
                            const btns = document.querySelectorAll('.download-btn');
                            const altBtn = Array.from(btns).find(b => b.textContent.includes('Alt'));
                            if (altBtn) {
                                const originalText = altBtn.textContent;
                                altBtn.textContent = '✓ Downloaded!';
                                altBtn.style.background = '#28a745';
                                setTimeout(() => {
                                    altBtn.textContent = originalText;
                                    altBtn.style.background = '#007bff';
                                }, 2000);
                            }
                        }
                    }, 'image/png', 1.0);
                }, 100);
            };
            
            img.onerror = function() {
                alert('Alternative method failed. Please try:\n1. Right-click diagram → Save Image\n2. Use browser screenshot');
            };
            
            img.src = svgDataUrl;
        }
        
        // Direct SVG download (works well and can be converted)
        function downloadSVG() {
            const svg = document.querySelector('svg');
            const svgData = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            const downloadLink = document.createElement('a');
            downloadLink.download = 'ChildSecurity_UseCase_Diagram.svg';
            downloadLink.href = url;
            downloadLink.click();
            URL.revokeObjectURL(url);
        }
    </script>
